name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend_lint:
    name: Frontend lint (pnpm)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  backend_lint:
    name: Backend lint (composer)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_pgsql
          coverage: none

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          APP_ENV=dev
          APP_SECRET=ci_secret
          DATABASE_URL=postgresql://questionaire:secret@127.0.0.1:5432/questionaire?serverVersion=16&charset=utf8
          DEFAULT_URI=test
          EOF

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: composer lint
